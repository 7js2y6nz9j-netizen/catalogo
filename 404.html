<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inluna · catálogo del taller</title>
  <meta name="robots" content="noindex">
  <script>
    /* Un enlace de pieza (…/p/<pieza>/) cuya página aún no existe (se crean
       cada hora) o cualquier dirección vieja: lleva al catálogo, a esa pieza. */
    (function () {
      var ruta = location.pathname;
      var m = ruta.match(/^(.*\/)p\/([^\/]+)\/?(?:index\.html)?$/);
      var base = m ? m[1] : (ruta.match(/^\/[^\/]+\//) || ['/'])[0];
      location.replace(base + (m ? '#p/' + m[2] : ''));
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4eee1; color: #3a2a1f;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
  </style>
</head>
<body>
  <p>Abriendo el catálogo…</p>
</body>
</html>
